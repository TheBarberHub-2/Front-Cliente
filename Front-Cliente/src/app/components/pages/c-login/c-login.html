<div class="c-login">
  <div class="c-login__overlay"></div>

  <div class="c-login__card">
    <div class="c-login__header">
      <h1 class="c-login__title" [routerLink]="['/']">TheBarberHub</h1>
      <p class="c-login__subtitle">Bienvenido de nuevo, accede a tu cuenta</p>
    </div>

    <form (ngSubmit)="onSubmitLogin()" #f="ngForm">
      <div class="c-login__form-group">
        <label class="c-login__label" for="email">Correo Electrónico</label>
        <div>
          <input class="c-login__input" id="email" name="email" type="email" required [(ngModel)]="login.email" placeholder="tu@email.com" />
        </div>
      </div>

      <div class="c-login__form-group">
        <label class="c-login__label" for="password">Contraseña</label>
        <div>
          <input class="c-login__input" id="password" name="contrasenya" type="password" required [(ngModel)]="login.contrasenya"
            placeholder="••••••••" />
        </div>
      </div>

      @if (error) {
      <div class="c-login__error">
        <i class="icon-error"></i>
        <span>{{ error }}</span>
      </div>
      }

      <button type="submit" class="c-login__btn-submit" [disabled]="!f.form.valid">
        <span>Iniciar Sesión</span>
        <i class="icon-arrow-right"></i>
      </button>

      <div class="c-login__footer">
        <p>¿No tienes cuenta? <a class="c-login__link" href="#">Regístrate aquí</a></p>
      </div>
    </form>
  </div>
</div>
